<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quỹ Tài Chính Cá Nhân</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky green header + 4 tabs (Hồ sơ, Chẩn đoán, Chiến lược, Dự phóng); one column on phone, wider reading column on desktop. */
:root{
  --bg:#F2F6F1; --surface:#FFFFFF; --fg:#12251A; --muted:#58695F; --line:#D8E2DA; --tint:#E7F0E9;
  --hdr:#1B4D37; --hdr-fg:#F1F7F3; --hdr-muted:#A9C7B6; --brand:#1E5A40; --brand-ink:#FFFFFF;
  --gold:#A86F12; --good:#1C7F4D; --warn:#A86F12; --bad:#B93A34;
  --good-bg:#DDF0E4; --warn-bg:#F7EBCF; --bad-bg:#F7DEDB;
  --c-nec:#2F6FB5; --c-ffa:#2E9B5E; --c-ltss:#12858A; --c-edu:#C9741F; --c-play:#7B52C4; --c-give:#C9453F; --c-debt:#7A3434;
  --line-a:#8B9A91;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1611; --surface:#14231A; --fg:#E3EEE7; --muted:#97A99E; --line:#27392E; --tint:#1A2D22;
  --hdr:#0F2A1E; --hdr-fg:#EAF4EE; --hdr-muted:#86A894; --brand:#44A87D; --brand-ink:#08140E;
  --gold:#E2A93B; --good:#4CC38A; --warn:#E2A93B; --bad:#F0807A;
  --good-bg:#183326; --warn-bg:#35290F; --bad-bg:#3A1C1A;
  --c-nec:#6AA6E8; --c-ffa:#4CC38A; --c-ltss:#3DBDBD; --c-edu:#F0A258; --c-play:#A98BE8; --c-give:#F0807C; --c-debt:#D98A8A;
  --line-a:#7F9287; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1611; --surface:#14231A; --fg:#E3EEE7; --muted:#97A99E; --line:#27392E; --tint:#1A2D22;
  --hdr:#0F2A1E; --hdr-fg:#EAF4EE; --hdr-muted:#86A894; --brand:#44A87D; --brand-ink:#08140E;
  --gold:#E2A93B; --good:#4CC38A; --warn:#E2A93B; --bad:#F0807A;
  --good-bg:#183326; --warn-bg:#35290F; --bad-bg:#3A1C1A;
  --c-nec:#6AA6E8; --c-ffa:#4CC38A; --c-ltss:#3DBDBD; --c-edu:#F0A258; --c-play:#A98BE8; --c-give:#F0807C; --c-debt:#D98A8A;
  --line-a:#7F9287; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;padding:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:30}
h1,h2,h3,p{margin:0}
h2{font-size:17px;font-weight:700;line-height:1.3;text-wrap:balance}
h3{font-size:15px;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);color:var(--hdr-fg)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{font-size:18px;font-weight:800;letter-spacing:.01em;line-height:1.2}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--hdr-muted);letter-spacing:0}
.pill{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--hdr-muted);white-space:nowrap}
.pill b{font-family:var(--f-num);font-size:20px;color:var(--hdr-fg)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:var(--hdr-muted);font:600 14px var(--f-body);padding:10px 12px 9px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--hdr-fg);border-bottom-color:var(--gold)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

main{padding-block:20px 56px}
.panel{display:none;flex-direction:column;gap:28px}
.panel.on{display:flex}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec>p.lead{color:var(--muted);font-size:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}

/* inputs */
.note{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--tint);border-radius:8px;padding:10px 14px;font-size:13px}
.note button,.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;font:600 13px var(--f-body);padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px 18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tag{font:700 10px var(--f-num);color:#fff;border-radius:3px;padding:1px 5px;letter-spacing:.04em}
.inp{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.inp:focus-within{border-color:var(--brand)}
.inp input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:500 16px var(--f-num);padding:10px 4px 10px 12px;outline:none}
.inp span{color:var(--muted);font-size:12px;padding-right:12px;white-space:nowrap}

/* diagnosis */
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{flex:none;width:132px;height:132px}
.ring text{font-family:var(--f-num);fill:var(--fg)}
.hero .t{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.grade{font-size:22px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:12px 12px 12px 0;display:flex;flex-direction:column;gap:2px}
.stats b{font:600 18px var(--f-num)}
.stats small{font-size:12px;color:var(--muted)}
.comp{display:grid;gap:10px}
.comp .r{display:grid;grid-template-columns:minmax(110px,1.1fr) 3fr auto;gap:10px;align-items:center;font-size:13px}
.track{height:8px;border-radius:4px;background:var(--tint);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--brand)}
.find{display:flex;flex-direction:column;gap:0}
.find .f{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.find .f:first-child{border-top:1px solid var(--line)}
.chip{font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap;align-self:start;margin-top:2px}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.good{background:var(--good-bg);color:var(--good)}
.find p{font-size:13.5px;color:var(--muted);grid-column:2}
.find h3{font-size:14.5px;grid-column:2;grid-row:1}
.find .chip{grid-column:1;grid-row:1}
.jars{display:flex;flex-direction:column}
.jr{display:grid;grid-template-columns:minmax(96px,1fr) 3fr minmax(70px,auto);gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.jr .nm{display:flex;align-items:center;gap:6px;min-width:0}
.bar{position:relative;height:12px;background:var(--tint);border-radius:3px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);text-decoration:none}
.jr .v{text-align:right;line-height:1.25}
.jr .v b{font:600 13px var(--f-num)}
.jr .v small{display:block;font-size:11px}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend u{display:inline-block;width:2px;height:12px;background:var(--fg);vertical-align:-2px;margin-right:5px;text-decoration:none}

/* strategy */
.verdict{background:var(--hdr);color:var(--hdr-fg);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:6px}
.verdict small{font-size:12px;color:var(--hdr-muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.verdict p{font-size:16px;font-weight:600;line-height:1.45}
.golden{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;background:var(--tint);border-radius:8px;padding:12px 14px;font-size:13.5px;text-align:center}
.golden b{font-family:var(--f-num)}
ol.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stage{display:grid;grid-template-columns:32px 1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.stage:first-child{border-top:1px solid var(--line)}
.stage .n{grid-row:1/3;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 13px var(--f-num);color:var(--muted)}
.stage.done .n{background:var(--good);border-color:var(--good);color:#fff}
.stage.cur .n{background:var(--gold);border-color:var(--gold);color:#fff}
.stage h3{font-size:14.5px}
.stage p{font-size:13px;color:var(--muted);grid-column:2/4}
.stage .eta{font:600 12px var(--f-num);color:var(--muted);align-self:center;text-align:right}
.stage.cur h3{color:var(--gold)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:var(--f-body)}
td.w{text-align:left;font-family:var(--f-body);white-space:normal;color:var(--muted);min-width:150px}
th.w{text-align:left}
tr:last-child td{border-bottom:0}
td .tag{margin-right:6px}
.up{color:var(--good)} .dn{color:var(--bad)}
.flow{display:flex;flex-direction:column;gap:0}
.flow .s{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.flow .s:first-child{border-top:1px solid var(--line)}
.flow .s small{color:var(--muted);font-size:12.5px;grid-column:1}
.flow .s b{font:600 14px var(--f-num);grid-row:1/3;grid-column:2;align-self:center}
.princ{display:grid;gap:0}
.princ details{border-bottom:1px solid var(--line);padding:2px 0}
.princ details:first-child{border-top:1px solid var(--line)}
.princ summary{cursor:pointer;font-weight:600;font-size:14.5px;padding:11px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.princ summary::-webkit-details-marker{display:none}
.princ summary::after{content:"+";color:var(--muted);font-weight:400}
.princ details[open] summary::after{content:"−"}
.princ p{font-size:13.5px;color:var(--muted);padding-bottom:12px}
.chk{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.chk label{display:grid;grid-template-columns:22px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;font-size:13.5px}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--brand)}
.chk b{display:block;font-size:14px}
.chk span{color:var(--muted)}
.chk input:checked+div b{text-decoration:line-through;color:var(--muted)}
ul.acts{margin:0;padding:0 0 0 18px;display:grid;gap:8px;font-size:14px}

/* projection */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.seg button{background:var(--surface);color:var(--fg);border:0;border-right:1px solid var(--line);font:600 13px var(--f-body);padding:8px 16px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 8px 8px}
svg.ch{width:100%;height:auto;display:block}
.ch text{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
.cmp table{min-width:0}
.ch .lab{fill:var(--fg);font-weight:600}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .la{stroke:var(--line-a);fill:none;stroke-width:2;stroke-dasharray:5 4}
.ch .lb{stroke:var(--brand);fill:none;stroke-width:2.5}
.ch .ar{fill:var(--brand);opacity:.12}
.ch .gl{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:2 4}
.ch .dot{fill:var(--brand);stroke:var(--surface);stroke-width:2}
.ch .dotg{fill:var(--gold);stroke:var(--surface);stroke-width:2}
.key{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:6px 8px 0}
.key i{display:inline-block;width:18px;height:0;border-top:3px solid var(--brand);vertical-align:3px;margin-right:6px}
.key i.a{border-top:2px dashed var(--line-a)}
.cmp td.best{color:var(--good);font-weight:600}
.fine{font-size:12px;color:var(--muted);line-height:1.5}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.plats{display:grid;gap:12px}.pl{display:flex;flex-direction:column;gap:10px}
#pj-dyn{display:flex;flex-direction:column;gap:28px}
.pvr{display:grid;grid-template-columns:1fr minmax(130px,170px);gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pvr:first-child{border-top:1px solid var(--line)}
.pvr .nm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.pvr .nm small{flex-basis:100%;color:var(--muted);font-size:12px}
.pvr .sg{grid-column:1;font-size:12px;color:var(--muted)}
.pvr .inp{grid-column:2;grid-row:1/3}
.pvr .inp input{font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font:500 12px var(--f-num);color:var(--muted);min-height:0}
.inp .mh{font:500 12px var(--f-num);color:var(--muted);font-style:normal;padding-right:8px;white-space:nowrap}
.inp select.u{flex:none;width:auto;border-left:1px solid var(--line);padding:10px 10px;font-size:14px}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);padding:6px 10px 2px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.pie{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:6px 10px}
.pie svg{width:150px;height:150px;flex:none}
.pie ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;flex:1;min-width:190px}
.pie li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}
.pie li i{width:10px;height:10px;border-radius:2px}
.pie li b{font:600 12px var(--f-num)}
.chartbox h3{padding:0 8px 6px;font-size:14px}
#st-charts{gap:14px}
.subh{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.box h3{font-size:14px}
/* sổ thu */
.inp.big input{font-size:22px;padding:12px 4px 12px 14px}
.inp input:disabled{opacity:.7}
.inp select{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:500 15px var(--f-body);padding:11px 8px;outline:none}
.inp input[type=date],.inp input[type=text]{font-family:var(--f-body);font-size:15px}
.cb{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.cb input{width:18px;height:18px;accent-color:var(--brand)}
.flow .s em{font:600 11px var(--f-num);color:var(--muted);font-style:normal;margin-left:6px}
.flow .s b.neg{color:var(--bad)}
.hist .s{grid-template-columns:1fr auto auto;align-items:center}
.hist .s .x{grid-row:1/3;grid-column:3}
.x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;font:600 12px var(--f-body);padding:5px 9px;cursor:pointer}
.chip.k{background:var(--tint);color:var(--muted);margin-right:6px}
#q-msg{min-height:1.2em;color:var(--good)}
@media (max-width:420px){.comp .r{grid-template-columns:1fr auto}.comp .r .track{grid-column:1/3;grid-row:2}.jr{grid-template-columns:1fr auto}.jr .bar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:no-preference){.track i,.bar i{transition:width .3s}}
</style>

<header>
  <div class="wrap">
    <div class="hrow">
      <div class="brand">Quỹ Tài Chính Cá Nhân<small>Mô hình 6 hũ · ví và lãi suất do bạn nhập</small></div>
      <div class="pill"><span>Sức khoẻ<br>tài chính</span><b id="hscore">–</b></div>
    </div>
    <nav role="tablist" aria-label="Các phần">
      <button role="tab" data-tab="so-thu" aria-selected="true">Sổ thu</button>
      <button role="tab" data-tab="tiet-kiem" aria-selected="false">Tiết kiệm</button>
      <button role="tab" data-tab="thong-ke" aria-selected="false">Thống kê</button>
      <button role="tab" data-tab="ho-so" aria-selected="false">Hồ sơ</button>
      <button role="tab" data-tab="chan-doan" aria-selected="false">Chẩn đoán</button>
      <button role="tab" data-tab="chien-luoc" aria-selected="false">Chiến lược</button>
      <button role="tab" data-tab="du-phong" aria-selected="false">Dự phóng</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="panel on" id="p-so-thu"></div>
  <div class="panel" id="p-tiet-kiem"></div>
  <div class="panel" id="p-thong-ke"></div>
  <div class="panel" id="p-ho-so"></div>
  <div class="panel" id="p-chan-doan"></div>
  <div class="panel" id="p-chien-luoc"></div>
  <div class="panel" id="p-du-phong"></div>
</main>

<script>
(function(){
'use strict';
var JARS=[
 {k:'NEC', n:'Thiết yếu',        p:55,c:'--c-nec', w:'Vietcombank (tài khoản nhận lương)', d:'Ăn uống, nhà ở, đi lại, điện nước, học phí'},
 {k:'FFA', n:'Tự do tài chính',  p:10,c:'--c-ffa', w:'App đầu tư dài hạn',                  d:'Đầu tư tạo dòng tiền, không rút để tiêu'},
 {k:'LTSS',n:'Tiết kiệm dài hạn',p:10,c:'--c-ltss',w:'ZaloPay (tiền tích kiệm)',            d:'Quỹ khẩn cấp, khoản mua lớn, dự án tương lai'},
 {k:'EDU', n:'Phát triển',       p:10,c:'--c-edu', w:'Vietcombank (phát triển)',            d:'Sách, khoá học, kỹ năng, ngoại ngữ, công cụ làm việc'},
 {k:'PLAY',n:'Hưởng thụ',        p:10,c:'--c-play',w:'MoMo (chi tiêu lặt vặt)',             d:'Cà phê, ăn uống bạn bè, đồ yêu thích, thư giãn'},
 {k:'GIVE',n:'Cho đi',           p:5, c:'--c-give',w:'BIDV (tiền quà gửi)',                 d:'Quà sinh nhật, giúp đỡ người thân, từ thiện'}
];

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function fmt(n){return Math.round(n).toLocaleString('vi-VN')}
function vnd(n){return fmt(n)+' đ'}
function sh(n){var a=Math.abs(n),s=n<0?'−':'';
 if(a>=1e9)return s+(a/1e9).toFixed(2).replace('.',',')+' tỷ';
 if(a>=1e6)return s+(a/1e6).toFixed(a>=1e8?0:1).replace('.',',')+' tr';
 if(a>=1e3)return s+Math.round(a/1e3)+'k';return s+Math.round(a)}
function p1(n){return (Math.round(n*10)/10).toString().replace('.',',')+'%'}
function mo(m){if(m==null)return 'Chưa đạt sau 40 năm';if(m===0)return 'Đã đạt';if(m<12)return m+' tháng';var y=m/12;return (Math.round(y*10)/10).toString().replace('.',',')+' năm'}
function getP(k){return k.indexOf('a.')===0?S.a[k.slice(2)]:S[k]}

/* ---------- analysis ---------- */
function analyze(s){
 var inc=Math.max(0,s.income+s.other),a=s.a,sum=0;
 JARS.forEach(function(j){sum+=a[j.k]});
 var R={inc:inc,sum:sum,leak:inc-sum};
 R.pct=function(k){return inc?a[k]/inc*100:0};
 R.necPct=R.pct('NEC');
 R.em=a.NEC>0?s.emergency/a.NEC:0;
 R.sr=inc?(a.FFA+a.LTSS)/inc*100:0;
 R.hi=s.debt>0&&s.debtRate>=12;
 R.debtMonthlyInt=s.debt*s.debtRate/1200;
 var comps=[];
 comps.push({n:'Tỷ lệ tiết kiệm + đầu tư',max:30,v:30*Math.min(1,R.sr/20),note:p1(R.sr)+' thu nhập'});
 comps.push({n:'Quỹ khẩn cấp',max:25,v:25*Math.min(1,R.em/6),note:p1(R.em)+' tháng'});
 var ds=s.debt<=0?20:Math.max(0,Math.min(20,20-(inc?s.debt/inc:9)*3-(R.hi?6:0)));
 comps.push({n:'Gánh nặng nợ',max:20,v:ds,note:s.debt>0?sh(s.debt):'Không nợ'});
 var ns=R.necPct<=55?15:Math.max(0,15-(R.necPct-55)*0.75);
 comps.push({n:'Chi thiết yếu ≤ 55%',max:15,v:inc?ns:0,note:p1(R.necPct)});
 var lr=inc?Math.max(0,R.leak/inc):1,ls=R.leak<0?0:10*(1-Math.min(1,lr/0.15));
 comps.push({n:'Kiểm soát dòng tiền',max:10,v:inc?ls:0,note:R.leak<0?'Chi vượt thu':p1(inc?lr*100:0)+' chưa gán hũ'});
 R.comps=comps;
 R.score=Math.round(comps.reduce(function(t,c){return t+c.v},0));
 R.grade=R.score>=80?['Vững vàng','good']:R.score>=60?['Khá ổn, còn chỗ tối ưu','good']:R.score>=40?['Cần chỉnh lại cấu trúc','warn']:['Báo động, cần xử lý ngay','bad'];
 return R;
}

function findings(s,R){
 var f=[],a=s.a;
 if(R.leak<0)f.push({sev:'bad',t:'Chi vượt thu '+vnd(-R.leak)+' mỗi tháng',d:'Tổng chi các hũ lớn hơn thu nhập. Khoản thiếu đang được bù bằng nợ hoặc tiền tiết kiệm. Hãy kiểm tra lại số liệu hoặc cắt chi ngay.'});
 else if(R.inc&&R.leak/R.inc>0.05)f.push({sev:'warn',t:vnd(R.leak)+' mỗi tháng không thuộc hũ nào',d:'Đây là phần tiền bị rò rỉ ('+p1(R.leak/R.inc*100)+' thu nhập). Giao nó cho một hũ ngay khi lương về, nếu không nó sẽ biến mất vào chi tiêu vặt.'});
 if(R.hi)f.push({sev:'bad',t:'Nợ lãi '+s.debtRate+'%/năm đang ăn '+vnd(R.debtMonthlyInt)+' mỗi tháng',d:'Trả nợ này cho lợi suất chắc chắn '+s.debtRate+'%/năm, cao hơn mọi kênh đầu tư an toàn. Ưu tiên trả nợ trước khi tăng đầu tư.'});
 else if(s.debt>0)f.push({sev:'warn',t:'Còn nợ '+vnd(s.debt)+' với lãi '+s.debtRate+'%/năm',d:'Lãi suất ở mức vừa. Vẫn trả đều, đồng thời xây quỹ khẩn cấp song song.'});
 if(R.em<1)f.push({sev:'bad',t:'Quỹ khẩn cấp chưa đủ 1 tháng chi thiết yếu',d:'Một biến cố nhỏ (ốm, mất việc, hỏng xe) sẽ buộc bạn vay thêm. Đây là lỗ hổng cần vá đầu tiên.'});
 else if(R.em<3)f.push({sev:'bad',t:'Quỹ khẩn cấp mới được '+p1(R.em)+' tháng',d:'Mục tiêu tối thiểu là 3 tháng, lý tưởng 6 tháng chi thiết yếu ('+vnd(a.NEC*3)+' đến '+vnd(a.NEC*6)+').'});
 else if(R.em<6)f.push({sev:'warn',t:'Quỹ khẩn cấp '+p1(R.em)+' tháng, đã qua mức tối thiểu',d:'Tiếp tục nạp cho đến khi đủ 6 tháng ('+vnd(a.NEC*6)+'), sau đó chuyển phần tiết kiệm sang đầu tư.'});
 else f.push({sev:'good',t:'Quỹ khẩn cấp đủ '+p1(R.em)+' tháng',d:'Tấm đệm vững. Phần tiết kiệm mới có thể chuyển dần sang đầu tư dài hạn.'});
 if(s.irregular)f.push({sev:'warn',t:s.nDone>=2?'Thu nhập dao động '+Math.round(s.cv*100)+'% giữa các tháng':'Thu nhập không cố định',d:'Với thu nhập không đều, quỹ khẩn cấp nên dày hơn: mục tiêu 6 tháng chi thiết yếu thay vì 3. Kế hoạch đã dành thêm phần cho hũ Tiết kiệm dài hạn.'});
 if(R.sr<10)f.push({sev:'bad',t:'Chỉ tiết kiệm và đầu tư '+p1(R.sr)+' thu nhập',d:'Dưới 10% thì tài sản tăng rất chậm. Mức nên có là 20% (hũ FFA 10% + LTSS 10%).'});
 else if(R.sr<20)f.push({sev:'warn',t:'Tiết kiệm và đầu tư '+p1(R.sr)+' thu nhập',d:'Gần chuẩn 20%. Đẩy thêm '+p1(20-R.sr)+' điểm nữa để đạt chuẩn.'});
 else f.push({sev:'good',t:'Tiết kiệm và đầu tư '+p1(R.sr)+' thu nhập',d:'Bạn đã đạt hoặc vượt chuẩn 20%. Giữ kỷ luật này bằng lệnh chuyển tự động.'});
 if(R.inc&&R.necPct>55)f.push({sev:R.necPct>65?'bad':'warn',t:'Chi thiết yếu chiếm '+p1(R.necPct)+' (chuẩn 55%)',d:'Vượt chuẩn khoảng '+vnd(a.NEC-R.inc*0.55)+' mỗi tháng. Xem lại tiền nhà, ăn uống, gói cước và các khoản đăng ký định kỳ.'});
 if(R.inc&&R.pct('PLAY')>15)f.push({sev:'warn',t:'Hưởng thụ chiếm '+p1(R.pct('PLAY'))+' (chuẩn 10%)',d:'Đây là hũ dễ cắt nhất mà ít ảnh hưởng đến sinh hoạt thiết yếu.'});
 if(R.inc&&R.pct('EDU')<5)f.push({sev:'warn',t:'Hũ Phát triển chỉ '+p1(R.pct('EDU')),d:'Thu nhập là đòn bẩy lớn nhất của tài sản. Giữ tối thiểu 5 đến 6% cho kỹ năng.'});
 var order={bad:0,warn:1,good:2};
 return f.sort(function(x,y){return order[x.sev]-order[y.sev]});
}

/* ---------- optimal plan ---------- */
function makePlan(s,R){
 var P={NEC:55,FFA:10,LTSS:10,EDU:10,PLAY:10,GIVE:5,DEBT:0},fl={PLAY:5,GIVE:3,EDU:6,FFA:5,LTSS:5},short=0,inc=R.inc;
 function take(amt,order){var got=0;for(var i=0;i<order.length&&got<amt;i++){var k=order[i],can=Math.max(0,P[k]-fl[k]),t=Math.min(can,amt-got);P[k]-=t;got+=t}return got}
 var freed=0,n=R.necPct;
 if(inc&&n>55){var tg=Math.min(70,Math.max(55,Math.round(n-3))),need=tg-55,g=take(need,['PLAY','GIVE','EDU','FFA']);P.NEC+=g;short+=need-g}
 else if(inc&&n>0&&n<50){var t2=Math.max(45,Math.round(n)+2);freed=55-t2;P.NEC=t2}
 if(s.debt>0&&inc){var minPct=Math.ceil(s.minPay/inc*100),dp=Math.min(25,R.hi?Math.max(15,minPct):Math.max(5,minPct)),gd=take(dp,['PLAY','GIVE','FFA','EDU']);P.DEBT=gd;short+=dp-gd}
 if(freed){if(s.debt>0&&R.hi)P.DEBT+=freed;else if(R.em<6)P.LTSS+=freed;else P.FFA+=freed}
 if(R.em<3&&inc){var ge=take(6,['PLAY','GIVE','EDU','FFA']);P.LTSS+=ge}
 else if(s.irregular&&R.em<6&&inc){P.LTSS+=take(4,['PLAY','GIVE','EDU'])}
 else if(R.em>=6&&s.debt<=0&&!s.irregular){P.LTSS-=5;P.FFA+=5}
 P.short=short;
 return P;
}
function plan2(s,R){var s2=clone(s);s2.debt=0;return makePlan(s2,R)}

/* ---------- simulation ---------- */
function simulate(s,R,P1,P2){
 var N=480,inc=R.inc,a=s.a,rs=s.rSave/1200,ri=s.rInv/1200,rd=s.debtRate/1200;
 var A=[s.emergency+s.invest-s.debt],B=[A[0]];
 var D=s.debt,E=s.emergency,I=s.invest,dfA=s.debt>0?null:0,emA=s.emergency>=6*a.NEC?0:null;
 var m,due,pay;
 for(m=1;m<=N;m++){
  if(D>0.5){due=D*(1+rd);pay=Math.min(due,s.minPay);D=due-pay;if(D<0.5){D=0;if(dfA==null)dfA=m}}
  E=E*(1+rs)+a.LTSS;I=I*(1+ri)+a.FFA;
  if(emA==null&&E>=6*a.NEC)emA=m;
  A.push(E+I-D);
 }
 var Et=6*inc*P1.NEC/100;
 D=s.debt;E=s.emergency;I=s.invest;var dfB=s.debt>0?null:0,emB=E>=Et?0:null,left,budget,pl,lt,ff,need,toE;
 for(m=1;m<=N;m++){
  pl=D>0.5?P1:P2;left=0;
  if(D>0.5){budget=Math.max(inc*pl.DEBT/100,s.minPay);due=D*(1+rd);pay=Math.min(due,budget);D=due-pay;left=Math.max(0,inc*pl.DEBT/100-pay);if(D<0.5){D=0;if(dfB==null)dfB=m}}
  E*=1+rs;I*=1+ri;
  lt=inc*pl.LTSS/100+left;ff=inc*pl.FFA/100;
  need=Math.max(0,Et-E);toE=Math.min(lt,need);E+=toE;I+=lt-toE+ff;
  if(emB==null&&E>=Et)emB=m;
  B.push(E+I-D);
 }
 function first(arr,g){for(var i=0;i<arr.length;i++)if(arr[i]>=g)return i;return null}
 return {A:A,B:B,dfA:dfA,dfB:dfB,emA:emA,emB:emB,gA:first(A,s.goal),gB:first(B,s.goal),Et:Et};
}

/* ---------- UI: diagnosis ---------- */
function ring(score,col){
 var r=54,c=2*Math.PI*r,d=c*score/100;

function ckKey(){var d=new Date();return 'qtc.chk.'+d.getFullYear()+'-'+(d.getMonth()+1)}
function chkLoad(){try{return JSON.parse(localStorage.getItem(ckKey()))||{}}catch(e){return {}}}
function chkSave(c){try{localStorage.setItem(ckKey(),JSON.stringify(c))}catch(e){}}

/* ---------- UI: projection ---------- */
function niceStep(x){var p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function chart(sm,n,goal,showGoalLine){
 var W=420,H=300,L=46,Rr=16,T=20,Bm=30,A=sm.A.slice(0,n+1),B=sm.B.slice(0,n+1);
 var ymax=Math.max.apply(null,A.concat(B)),ymin=Math.min.apply(null,A.concat(B).concat([0]));
 var gIn=showGoalLine&&goal>0&&goal<=ymax*1.6;if(gIn)ymax=Math.max(ymax,goal);
 if(ymax<=ymin)ymax=ymin+1;
 var step=niceStep((ymax-ymin)/4);ymin=Math.floor(ymin/step)*step;ymax=Math.ceil(ymax/step)*step;
 function X(m){return L+(W-L-Rr)*m/n}
 function Y(v){return T+(H-T-Bm)*(1-(v-ymin)/(ymax-ymin))}
 var g='',v;
 for(v=ymin;v<=ymax+step/2;v+=step){g+='<line class="grid" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+sh(v)+'</text>'}
 var yrs=n/12,xs=yrs<=5?1:yrs<=10?2:5;
 for(var y=0;y<=yrs;y+=xs){g+='<text x="'+X(y*12).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+(y===0?'Nay':y+' năm')+'</text>'}
 function path(arr){var s='';for(var i=0;i<arr.length;i++)s+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(arr[i]).toFixed(1);return s}
 var base=Y(Math.max(ymin,0));
 g+='<path class="ar" d="'+path(B)+'L'+X(n).toFixed(1)+' '+base.toFixed(1)+'L'+X(0).toFixed(1)+' '+base.toFixed(1)+'Z"/>';
 if(gIn)g+='<line class="gl" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(goal).toFixed(1)+'" y2="'+Y(goal).toFixed(1)+'"/><text x="'+(L+6)+'" y="'+(Y(goal)-6).toFixed(1)+'" style="fill:var(--gold);font-weight:600">Mục tiêu '+sh(goal)+'</text>';
 g+='<path class="la" d="'+path(A)+'"/><path class="lb" d="'+path(B)+'"/>';
 var yb=Y(B[n]),ya=Y(A[n]),la=ya<=yb?ya-9:ya+16,lb=ya<=yb?yb+16:yb-9;
 g+='<circle class="dot" cx="'+X(n)+'" cy="'+yb.toFixed(1)+'" r="4.5"/><text class="lab" x="'+(W-Rr)+'" y="'+lb.toFixed(1)+'" text-anchor="end">'+sh(B[n])+'</text>';
 g+='<text x="'+(W-Rr)+'" y="'+la.toFixed(1)+'" text-anchor="end">'+sh(A[n])+'</text>';
 if(sm.dfB!=null&&sm.dfB>0&&sm.dfB<=n)g+='<circle class="dotg" cx="'+X(sm.dfB).toFixed(1)+'" cy="'+Y(B[sm.dfB]).toFixed(1)+'" r="4.5"/><text x="'+(X(sm.dfB)+8).toFixed(1)+'" y="'+(Y(B[sm.dfB])+16).toFixed(1)+'" style="fill:var(--gold);font-weight:600">Hết nợ · tháng '+sm.dfB+'</text>';
 return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Tài sản ròng theo thời gian: chiến lược tối ưu so với giữ nguyên">'+g+'</svg>';
}

 c+=chartCard('Thu nhập tháng này đã đi đâu',pie([{n:'Đã chi tiêu',v:sp,c:'--bad'},{n:'Tiết kiệm và đầu tư',v:sv2,c:'--c-ltss'},{n:'Phân bổ các hũ khác',v:Math.max(0,oth-sp),c:'--brand'},{n:'Chưa phân bổ',v:Math.max(0,inc-alT),c:'--line-a'}]));
 $('#st-charts').innerHTML=c;
 var rows=[];
 real.log.forEach(function(e){
  if(e.kind==='back')rows.push({d:e.date,id:e.id,c:e.note+(e.rest>0?' (chưa phân bổ '+sh(e.rest)+')':''),a:e.prin+e.int,cat:'Thu hồi cho vay',n:0});
  else if(e.kind==='alloc')rows.push({d:e.date,id:e.id,c:'Phân bổ vào hũ '+KEYS.filter(function(k){return e.split&&e.split[k]}).map(jname).join(', '),a:-e.rest,cat:'Phân bổ',n:0});
  else rows.push({d:e.date,id:e.id,c:(e.note||'Thu nhập')+(e.rest>0?' (chưa phân bổ '+sh(e.rest)+')':''),a:e.amt,cat:'Thu nhập',n:1})});
 real.spend.forEach(function(e){rows.push({d:e.date,id:e.id,c:e.note||'Chi từ hũ '+jname(e.jar),a:-e.amt,cat:'Chi · '+jname(e.jar),n:2})});
 (real.loans||[]).forEach(function(l){if(!l.jar)rows.push({d:l.date,id:l.id,c:'Cho '+l.who+' vay, chưa trừ hũ',a:-l.amt,cat:'Cho vay',n:0})});
 real.spend.forEach(function(e){if(e.loanId){var r=rows.filter(function(x){return x.id===e.id})[0];if(r)r.cat='Cho vay'}});
 real.deposits.forEach(function(d){rows.push({d:d.date,id:d.id,c:'Gửi tiết kiệm '+p1(d.rate)+'/năm, '+termTxt(d.months),a:d.principal,cat:'Tiết kiệm dài hạn',n:0})});
 var fl=rows.filter(function(r){return TXALL||mk(r.d)===cm}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:(a.id<b.id?1:-1)});
 var th='<h2>Giao dịch</h2><div class="seg" role="group" aria-label="Phạm vi"><button data-tx="m" aria-pressed="'+!TXALL+'">Tháng này</button><button data-tx="all" aria-pressed="'+TXALL+'">Tất cả</button></div>';
 if(!fl.length)th+='<p class="muted" style="font-size:14px">Chưa có giao dịch trong phạm vi này.</p>';
 else{th+='<div class="tw"><table><thead><tr><th>Ngày</th><th class="w">Nội dung</th><th>Số tiền</th><th class="w">Danh mục</th></tr></thead><tbody>';
  fl.slice(0,60).forEach(function(r){th+='<tr><td>'+dd(r.d)+'</td><td class="w" style="color:var(--fg)">'+esc(r.c)+'</td><td class="'+(r.n===1?'up':r.n===2?'dn':'')+'">'+(r.n===1?'+':r.n===2?'':'')+vnd(r.a)+'</td><td class="w">'+esc(r.cat)+'</td></tr>'});
  th+='</tbody></table></div>'+(fl.length>60?'<p class="fine">Hiển thị 60 giao dịch gần nhất.</p>':'')}
 $('#st-tx').innerHTML=th;
}

/* ---------- orchestration ---------- */
function render(){
 var real=S,bal=balances(real);
 JARS.forEach(function(j){j.w=walletOf(real,j.k)});
 S=eff(real,bal);
 try{
  var R=analyze(S),P1=makePlan(S,R),P2=plan2(S,R),sm=simulate(S,R,P1,P2);
  $('#hscore').textContent=R.inc?R.score:'–';
  renderNote();renderDiag(R);renderStrat(R,P1,P2,sm);renderProj(R,P1,P2,sm);
  window.__qtc={R:R,P1:P1,P2:P2,sm:sm,bal:bal,irr:S.irregular};
 }finally{S=real}
 syncIncome(real);renderLedger(real,bal);renderWal(real,bal);syncPlat(real,bal);renderSave(real,bal);renderStats(real,bal);updHints();
}
var TABS=['so-thu','tiet-kiem','thong-ke','ho-so','chan-doan','chien-luoc','du-phong'];
function go(t,noScroll){
 if(TABS.indexOf(t)<0)t='so-thu';
 TABS.forEach(function(x){$('#p-'+x).classList.toggle('on',x===t)});
 document.querySelectorAll('nav button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===t))});
 if(location.hash!=='#'+t)location.hash=t;
 if(!noScroll)window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.tab)})});
window.addEventListener('hashchange',function(){go(location.hash.slice(1),true)});
document.addEventListener('focusin',function(e){var t=e.target;if(t&&t.matches&&t.matches('input[inputmode="numeric"],input[inputmode="decimal"]'))setTimeout(function(){try{t.select()}catch(x){}},0)});
window.addEventListener('pageshow',function(){if(syncAmt())renderPreview()});
buildInputs();buildLedger();buildProj();buildSave();buildStats();render();
if(location.hash)go(location.hash.slice(1),true);
})();
